[project]
name = "personashield"
version = "0.1.0"
description = "Local-first OSINT and breach-intelligence CLI framework. No API keys required."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "PyYAML>=6.0",
    "dnspython>=2.6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[project.scripts]
personashield = "personashield.cli:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["personashield*"]

[tool.setuptools.package-data]
personashield = ["data/*.json"]
